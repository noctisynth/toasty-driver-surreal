name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Rust ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Check
        run: cargo check --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Three skipped cases are DynamoDB-specific negative assertions that
      # SurrealDB does not share. Four native-JSON cases hard-code SQL operation
      # shapes that cannot describe a KV driver; tests/native_json.rs covers
      # the equivalent runtime behavior. See tests/mem.rs for the rationale.
      - name: Test (in-memory + SurrealKV)
        run: >-
          cargo test --workspace --locked --
          --skip composite_index_too_many_range_columns
          --skip composite_unique_index_unsupported_on_dynamodb
          --skip starts_with_empty_prefix
          --skip json_native_round_trip
          --skip json_value_native_round_trip
          --skip json_native_nulls
          --skip json_value_native_nulls
      - name: Documentation
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  rocksdb:
    name: RocksDB end-to-end
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      # The embedded RocksDB engine compiles librocksdb from source, so it runs
      # in its own job. The e2e tests share one on-disk datastore per case and
      # must run single-threaded.
      - name: e2e (kv-rocksdb)
        run: cargo test --test e2e_rocksdb --features rocksdb --locked -- --test-threads=1
